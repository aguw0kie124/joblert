# Render blueprint: one free web service that runs the API and serves the built dashboard.
# Secrets are typed into the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: joblert
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, then starts the server.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: PUBSUB_TOKEN
        sync: false
